<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Edit Student</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    @media (max-width: 768px) {
      html { font-size: 15px; }
    }
    body {
      background: var(--bg, #eef2f7);
      min-height: 100vh;
    }
    .edit-popup-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.25rem;
    }
    .edit-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .edit-popup-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }
    .edit-popup-header p {
      margin: 2px 0 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .action-row {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .action-row .btn {
      min-width: 140px;
    }
  </style>
  <link rel="stylesheet" href="css/icons.css" />
</head>
<body>
  <div class="edit-popup-wrap">
    <div class="edit-popup-header">
      <div>
        <h2>Edit Student</h2>
        <p id="editStudentWindowSubtitle">Loading student details…</p>
      </div>
      <button type="button" class="modal-close" onclick="window.close()" title="Close window"
        style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted);">&times;</button>
    </div>

    <form id="editStudentWindowForm" class="admission-form" style="max-width:100%;">
      <input type="hidden" id="editStudentId" />

      <div class="form-row three-col">
        <div class="form-group"><label>First Name *</label><input type="text" id="editFirstName" required /></div>
        <div class="form-group"><label>Middle Name</label><input type="text" id="editMiddleName" /></div>
        <div class="form-group"><label>Last Name *</label><input type="text" id="editLastName" required /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Class *</label><select id="editClass" required><option value="">— Select —</option></select></div>
        <div class="form-group"><label>Term *</label><select id="editTerm" required><option value="First">First Term</option><option value="Second">Second Term</option><option value="Third">Third Term</option></select></div>
        <div class="form-group"><label>Date of Birth *</label><input type="date" id="editDOB" required /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Parent Name *</label><input type="text" id="editParentName" required /></div>
        <div class="form-group"><label>Parent Contact *</label><input type="tel" id="editParentContact" required /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Home Town</label><input type="text" id="editHomeTown" /></div>
        <div class="form-group"><label>Place of Stay</label><input type="text" id="editPlaceOfStay" /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Religion *</label><select id="editReligion" required><option value="Christian">Christian</option><option value="Muslim">Muslim</option><option value="Others">Others</option></select></div>
        <div class="form-group"><label>Teacher</label><input type="text" id="editTeacher" /></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Gender *</label><select id="editGender" required><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>
        <div class="form-group"><label>Previous School</label><input type="text" id="editPrevSchool" /></div>
        <div class="form-group"><label>Admission Date *</label><input type="date" id="editAdmissionDate" required /></div>
      </div>

      <div class="form-group photo-upload-group">
        <label>Student Photo</label>
        <div class="photo-upload-wrapper">
          <div class="photo-preview" id="editPhotoPreview">
            <img id="editPhotoPreviewImg" src="#" alt="Preview" style="display:none;width:100%;height:100%;object-fit:cover;" />
            <span id="editPhotoPlaceholder" style="font-size:0.85rem;color:var(--text-muted);">Current photo will be shown on open</span>
          </div>
          <div class="photo-actions">
            <input type="file" id="editPhoto" accept="image/*" />
            <label for="editPhoto" class="btn btn-secondary btn-sm">Choose File</label>
            <button type="button" class="btn btn-sm btn-clear" id="editClearPhoto" style="display:none;">Remove</button>
          </div>
        </div>
      </div>

      <div class="action-row">
        <button type="button" class="btn btn-secondary" onclick="window.close()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="editStudentWindowSubmitBtn">Update Student</button>
      </div>
    </form>

    <div id="editStudentWindowMessage" class="message" style="display:none;margin-top:0.75rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/supabase-config.js"></script>
  <script type="module" src="js/modules/edit-student.js"></script>
  <script type="module" src="js/icons-init.js"></script>
</body>
</html>
